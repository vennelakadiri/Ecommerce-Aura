<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura | Forgot Password</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Arial, sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: url('https://png.pngtree.com/background/20230519/original/pngtree-store-with-hanging-clothing-in-a-high-end-environment-picture-image_2654941.jpg') no-repeat center center/cover;
}

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.1);
}

.card {
  position: relative;
  width: 400px;
  background: #fff;
  border-radius: 25px;
  padding: 30px 40px;
  text-align: center;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.logo {
  font-size: 32px;
  font-weight: bold;
  letter-spacing: 4px;
  color: #b38b59;
}

.sub {
  font-size: 10px;
  color: #888;
  margin-bottom: 20px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

h2 {
  font-size: 24px;
  margin-bottom: 8px;
  color: #333;
}

.desc {
  font-size: 14px;
  color: #666;
  margin-bottom: 25px;
}

.input-group {
  text-align: left;
  margin-bottom: 20px;
}

.label-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.input-group label {
  font-size: 13px;
  font-weight: 600;
  color: #444;
}

.req-msg {
  font-size: 10px;
  color: #dc2626;
  display: none;
  font-weight: 600;
}

.input-group input {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #eee;
  font-size: 14px;
  background: #fdfdfd;
  outline: none;
  transition: 0.3s;
}

.input-group input:focus {
  border-color: #0a7c6f;
}

button {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 35px;
  background: #0a7c6f;
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
  margin-top: 5px;
}

button:hover {
  background: #08685d;
  transform: translateY(-1px);
}

.login-link {
  margin-top: 20px;
  font-size: 14px;
  color: #555;
}

.login-link a {
  color: #0a7c6f;
  text-decoration: none;
  font-weight: bold;
}

.login-link a:hover {
  text-decoration: underline;
}

#msg {
  margin-top: 15px;
}

@media (max-width: 480px) {
  .card {
    width: 90%;
    padding: 20px 25px;
  }
}
</style>
</head>
<body>

<div class="overlay"></div>

<div class="card">
  <div class="logo">AURA</div>
  <div class="sub">Boutique & Apparel</div>

  <h2>Reset Password</h2>
  <div class="desc">Enter your Email or Phone to set a new password</div>

  <form id="forgotForm" onsubmit="event.preventDefault(); validateForm();">{% csrf_token %}
    <div class="input-group">
      <div class="label-row">
        <label>Email or Phone Number</label>
        <span id="identityReq" class="req-msg">Email or Phone is required</span>
      </div>
      <input type="text" id="identity" placeholder="Enter your Email or Phone n.o."
        oninput="if(!/[a-zA-Z@]/.test(this.value)) { this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10); }">
    </div>

    <div class="input-group">
      <div class="label-row">
        <label>New Password</label>
        <span id="passReq" class="req-msg">New Password is required</span>
      </div>
      <input type="password" id="newPassword" placeholder="Enter new password">
    </div>

    <div class="input-group">
      <div class="label-row">
        <label>Confirm New Password</label>
        <span id="confirmReq" class="req-msg">Passwords do not match</span>
      </div>
      <input type="password" id="confirmPassword" placeholder="Confirm new password">
    </div>

    <button type="submit">RESET PASSWORD</button>
  </form>

  <div class="login-link">
    Remember your password? <a href="/accounts/login/">Sign in</a>
  </div>

  <div id="msg"></div>
</div>

<script>
async function validateForm() {
  const identityField = document.getElementById("identity");
  const passField = document.getElementById("newPassword");
  const confirmField = document.getElementById("confirmPassword");
  
  const identityReq = document.getElementById("identityReq");
  const passReq = document.getElementById("passReq");
  const confirmReq = document.getElementById("confirmReq");
  const msg = document.getElementById("msg");

  identityReq.style.display = "none";
  passReq.style.display = "none";
  confirmReq.style.display = "none";
  msg.innerHTML = "";

  let valid = true;

  if (!identityField.value.trim()) {
    identityReq.style.display = "inline";
    valid = false;
  }
  if (!passField.value.trim()) {
    passReq.style.display = "inline";
    valid = false;
  }
  if (passField.value.trim() !== confirmField.value.trim()) {
    confirmReq.style.display = "inline";
    valid = false;
  }

  if (!valid) return;

  resetPassword({
    identity: identityField.value.trim(),
    new_password: passField.value.trim()
  });
}

async function resetPassword(payload) {
  const msg = document.getElementById("msg");
  try {
    const csrf = getCookie('csrftoken');
    const response = await fetch('/accounts/forgot-password/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': csrf || ''
      },
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (response.ok) {
      msg.innerHTML = "<div style='color:#059669; font-size:13px;'>Password reset successful! Redirecting to login...</div>";
      setTimeout(() => {
        window.location.href = "/accounts/login/";
      }, 1500);
    } else {
      msg.innerHTML = `<div style='color:#dc2626; font-size:13px;'>${result.detail || "Reset failed"}</div>`;
    }
  } catch (error) {
    msg.innerHTML = "<div style='color:#dc2626; font-size:13px;'>Connection failed. Please try again.</div>";
  }
}

function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
</script>

</body>
</html>
